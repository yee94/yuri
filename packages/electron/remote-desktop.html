<!doctype html><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; media-src blob:; connect-src 'self';">
<video muted autoplay playsinline></video><canvas></canvas><script>
const bridge = window.captureBridge;
const video = document.querySelector('video');
const canvas = document.querySelector('canvas');
let peer, stream, fallback = false, waiting = false, capturing = false, timer;
let pendingIce = [];
const report = () => bridge.send({type:'failure'});
async function frame() {
  if (!fallback || waiting || capturing || !video.videoWidth) return;
  capturing = true;
  try {
    const factor = Math.min(1, 1440 / video.videoWidth, 900 / video.videoHeight);
    const width = Math.round(video.videoWidth * factor), height = Math.round(video.videoHeight * factor);
    if (canvas.width !== width) canvas.width = width;
    if (canvas.height !== height) canvas.height = height;
    canvas.getContext('2d', {alpha:false}).drawImage(video, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.65));
    if (blob && fallback && blob.size <= 512 * 1024) {
      waiting = true;
      bridge.frame(await blob.arrayBuffer());
    }
  } finally { capturing = false; }
}
bridge.onMessage(async message => {
  try {
    if (message.type === 'start') {
      stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{mandatory:{
        chromeMediaSource:'desktop', chromeMediaSourceId:message.sourceId,
        maxWidth:1920, maxHeight:1080, maxFrameRate:30
      }}});
      video.srcObject = stream;
      await video.play();
      const track = stream.getVideoTracks()[0];
      track.contentHint = 'detail';
      track.onended = report;
      bridge.send({type:'ready', width:video.videoWidth, height:video.videoHeight});
      peer = new RTCPeerConnection({iceServers:message.iceServers});
      peer.onicecandidate = event => { if (event.candidate) bridge.send({type:'ice',candidate:event.candidate.toJSON()}); };
      const sender = peer.addTrack(track, stream);
      const params = sender.getParameters();
      params.encodings = [{maxBitrate:4000000,maxFramerate:30}];
      await sender.setParameters(params);
      await peer.setLocalDescription(await peer.createOffer());
      bridge.send({type:'offer',sdp:peer.localDescription.sdp});
    } else if (message.type === 'answer' && !fallback) {
      await peer.setRemoteDescription({type:'answer',sdp:message.sdp});
      for (const candidate of pendingIce) await peer.addIceCandidate(candidate);
      pendingIce = [];
    } else if (message.type === 'ice' && !fallback) {
      if (peer.remoteDescription) await peer.addIceCandidate(message.candidate);
      else if (pendingIce.length < 128) pendingIce.push(message.candidate);
    } else if (message.type === 'fallback' && !fallback) {
      fallback = true;
      peer?.close();
      bridge.send({type:'transport',transport:'tunnel'});
      timer = setInterval(() => { void frame().catch(report); }, 83);
    } else if (message.type === 'ack') waiting = false;
  } catch { if (stream) bridge.send({type:'rtc-failed'}); else report(); }
});
window.addEventListener('unload', () => {
  clearInterval(timer);
  peer?.close();
  stream?.getTracks().forEach(track => track.stop());
});
bridge.loaded();
</script>
